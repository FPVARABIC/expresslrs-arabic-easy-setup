name: M2 audit source export

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-audit-format-export.yml

permissions:
  contents: read

jobs:
  export:
    name: Export exact source and locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Assemble exact source snapshot
        run: |
          mkdir -p /tmp/elrs-audit-source
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '**/node_modules' \
            --exclude 'dist' \
            --exclude '**/dist' \
            --exclude 'coverage' \
            --exclude '**/coverage' \
            ./ /tmp/elrs-audit-source/
          git rev-parse HEAD > /tmp/elrs-audit-source/AUDIT_HEAD_SHA

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elrs-audit-source
          path: /tmp/elrs-audit-source
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

      - name: Upload installed dependency tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elrs-audit-node-modules
          path: |
            node_modules
            apps/web/node_modules
            packages/*/node_modules
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
