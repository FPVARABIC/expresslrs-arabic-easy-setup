name: M2 hardware audit source export

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-audit-format-export.yml

permissions:
  contents: read

jobs:
  export:
    name: Export formatted source and locked toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out audit candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the repository formatter
        run: pnpm format

      - name: Assemble full formatted source
        run: |
          mkdir -p /tmp/elrs-easy-source
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '**/node_modules' \
            --exclude 'dist' \
            --exclude '**/dist' \
            --exclude 'coverage' \
            --exclude '**/coverage' \
            ./ /tmp/elrs-easy-source/

      - name: Archive locked node modules
        run: |
          tar -czf /tmp/elrs-easy-node-modules.tar.gz \
            node_modules \
            apps/web/node_modules \
            packages/*/node_modules

      - name: Upload full formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elrs-easy-full-formatted-source
          path: /tmp/elrs-easy-source
          if-no-files-found: error
          retention-days: 3

      - name: Upload locked node modules
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elrs-easy-node-modules
          path: /tmp/elrs-easy-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1
