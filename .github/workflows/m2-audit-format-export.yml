name: M2 apply audited foundation repair

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-audit-format-export.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply, format, and verify audited repair
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out hardware branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          cat > /tmp/foundation-repair.b64 <<'PATCH'

PATCH
          base64 -d /tmp/foundation-repair.b64 > /tmp/foundation-repair.patch
          git apply --check /tmp/foundation-repair.patch
          git apply /tmp/foundation-repair.patch

      - name: Format and verify full repository
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/DeviceConnectionHub.tsx \
            apps/web/src/hardware/crsf.ts \
            packages/platform-browser/src/firmware-artifact-decompression.ts
          git commit -m "fix(hardware): stabilize CRSF and user session foundation"
          git push origin HEAD:feat/m2-real-hardware-first-test
