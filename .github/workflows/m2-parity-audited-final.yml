name: M2 audited final parity validation

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-parity-audited-final.yml

permissions:
  contents: write

concurrency:
  group: m2-audited-final-parity
  cancel-in-progress: true

jobs:
  audit:
    name: Record every parity gate and commit only an honest result
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Check out parity branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and pin dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee /tmp/install.log
          pnpm --filter @elrs-easy/web add fflate@0.8.2 --save-exact 2>&1 | tee -a /tmp/install.log

      - name: Format candidate
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee /tmp/format.log
          pnpm format:check 2>&1 | tee -a /tmp/format.log

      - name: Lint candidate
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/lint.log

      - name: Typecheck candidate
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Run repository policy gates
        id: policies
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm check:boundaries
            pnpm check:security-headers
            pnpm check:pwa-safety
            pnpm check:visual-theme
            pnpm check:links
            pnpm check:master-plan
          } 2>&1 | tee /tmp/policies.log

      - name: Run complete automated tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/tests.log

      - name: Run live official catalog contract test
        id: live
        continue-on-error: true
        env:
          EXPRESSLRS_LIVE_CATALOG: "1"
        run: |
          set -o pipefail
          pnpm exec vitest run apps/web/src/hardware/official-catalog.live.test.ts 2>&1 | tee /tmp/live.log

      - name: Build production application
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build.log

      - name: Build and verify Pages artifact
        id: pages
        continue-on-error: true
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /expresslrs-arabic-easy-setup/
        run: |
          set -o pipefail
          {
            pnpm --filter @elrs-easy/web build
            pnpm check:pages-build
          } 2>&1 | tee /tmp/pages.log

      - name: Verify licenses and advisories
        id: supply
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm licenses:report
            pnpm licenses:check
            pnpm security:audit
          } 2>&1 | tee /tmp/supply.log

      - name: Write auditable parity result
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          POLICIES: ${{ steps.policies.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LIVE: ${{ steps.live.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          SUPPLY: ${{ steps.supply.outcome }}
        run: |
          mkdir -p docs/testing
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          gates = [
              ('Install', os.environ['INSTALL'], '/tmp/install.log'),
              ('Format', os.environ['FORMAT'], '/tmp/format.log'),
              ('Lint', os.environ['LINT'], '/tmp/lint.log'),
              ('TypeScript', os.environ['TYPECHECK'], '/tmp/typecheck.log'),
              ('Policy gates', os.environ['POLICIES'], '/tmp/policies.log'),
              ('Automated tests', os.environ['TESTS'], '/tmp/tests.log'),
              ('Live official catalog', os.environ['LIVE'], '/tmp/live.log'),
              ('Production build', os.environ['BUILD'], '/tmp/build.log'),
              ('Pages build', os.environ['PAGES'], '/tmp/pages.log'),
              ('Licenses and advisories', os.environ['SUPPLY'], '/tmp/supply.log'),
          ]
          success = all(outcome == 'success' for _, outcome, _ in gates)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          lines = [
              '# ExpressLRS feature-parity validation',
              '',
              f'- Candidate input SHA: `{head}`',
              f'- Overall: `{"PASS" if success else "FAIL"}`',
              '- Hardware observed: `NONE`',
              '- Real RF-link success claimed: `NO`',
              '',
              '## Gate results',
              '',
              '| Gate | Outcome |',
              '|---|---|',
          ]
          for name, outcome, _ in gates:
              lines.append(f'| {name} | `{outcome.upper()}` |')
          lines.extend([
              '',
              '## Implemented TX/RX parity scope',
              '',
              '- Official release and Target catalog ingestion.',
              '- Regulatory region/domain separation.',
              '- Target-specific Firmware acquisition and configuration.',
              '- Binding-phrase UID generation.',
              '- TX/RX Firmware options, package hashes, and recovery package.',
              '- CRSF identity, complete parameter enumeration, setting write/read-back, backup/restore, and Bind command.',
              '- Direct Espressif serial flashing.',
              '- EdgeTX and flight-controller serial passthrough.',
              '- STM32 receiver XMODEM-CRC transfer.',
              '- Wi-Fi handoff, Firmware download, and target-specific Lua download.',
              '- Post-write reconnect and exact Target verification.',
              '',
              '## Explicit remaining boundaries',
              '',
              '- Internal ST-Link/WebUSB writing is not claimed by this checkpoint.',
              '- Backpack and VRX targets are outside the current TX/RX scope.',
              '- Physical success remains pending the first observed reference-device session.',
          ])
          if not success:
              lines.extend(['', '## Failure tails', ''])
              for name, outcome, log_path in gates:
                  if outcome == 'success':
                      continue
                  path = Path(log_path)
                  tail = path.read_text(encoding='utf-8', errors='replace').splitlines()[-80:] if path.exists() else ['No log was produced.']
                  lines.extend([f'### {name}', '', '```text', *tail, '```', ''])
          Path('docs/testing/expresslrs-feature-parity-validation.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          Path('/tmp/parity-success').write_text('1' if success else '0', encoding='utf-8')
          PY

      - name: Commit source and validation evidence
        if: always()
        shell: bash
        run: |
          result="$(cat /tmp/parity-success)"
          if [ "$result" = "1" ]; then
            rm -f .github/workflows/m2-parity-audited-final.yml
            rm -f .github/workflows/m2-parity-repair-v3.yml
            rm -f .github/workflows/m2-parity-repair-v2.yml
            rm -f .github/workflows/m2-parity-finalize.yml
            rm -f .github/workflows/m2-audit-format-export.yml
            message='feat(parity): complete audited ExpressLRS TX/RX workflow'
          else
            message='chore(parity): preserve failed parity diagnostics'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No validation changes to commit'
          else
            git commit -m "$message"
            git push origin HEAD:feat/m2-real-hardware-first-test
          fi

      - name: Enforce final result
        if: always()
        run: |
          if [ "$(cat /tmp/parity-success)" != "1" ]; then
            echo '::error::At least one parity gate failed. The exact tails were committed to docs/testing/expresslrs-feature-parity-validation.md.'
            exit 1
          fi
