name: M2 certify ExpressLRS TX/RX software candidate

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-parity-release-candidate.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: m2-certify-expresslrs-tx-rx
  cancel-in-progress: true

jobs:
  certify:
    name: Wait for convergence, run every gate, and publish exact evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Wait for any older convergence run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deadline=$((SECONDS + 480))
          while [ "$SECONDS" -lt "$deadline" ]; do
            active="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feat%2Fm2-real-hardware-first-test&per_page=100" \
                --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\") | select(.name != \"CI\") | .id" \
                | wc -l
            )"
            if [ "$active" -eq 0 ]; then
              break
            fi
            sleep 15
          done
          git fetch origin feat/m2-real-hardware-first-test
          git reset --hard origin/feat/m2-real-hardware-first-test

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependency graph
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log

      - name: Formatting
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm format:check 2>&1 | tee /tmp/format.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/lint.log

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Product and repository policies
        id: policies
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm check:boundaries
            pnpm check:security-headers
            pnpm check:pwa-safety
            pnpm check:visual-theme
            pnpm check:links
            pnpm check:master-plan
            pnpm check:real-hardware-primary
          } 2>&1 | tee /tmp/policies.log

      - name: Complete automated tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/tests.log

      - name: Live official artifact contracts
        id: live
        continue-on-error: true
        env:
          EXPRESSLRS_LIVE_CATALOG: "1"
        run: |
          set -o pipefail
          pnpm exec vitest run \
            apps/web/src/hardware/official-catalog.live.test.ts \
            apps/web/src/hardware/official-artifacts.live.test.ts \
            2>&1 | tee /tmp/live.log

      - name: Production build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build.log

      - name: GitHub Pages artifact
        id: pages
        continue-on-error: true
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /expresslrs-arabic-easy-setup/
        run: |
          set -o pipefail
          {
            pnpm --filter @elrs-easy/web build
            pnpm check:pages-build
          } 2>&1 | tee /tmp/pages.log

      - name: Licenses and advisories
        id: supply
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm licenses:report
            pnpm licenses:check
            pnpm security:audit
          } 2>&1 | tee /tmp/supply.log

      - name: Generate exact certification report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          POLICIES: ${{ steps.policies.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LIVE: ${{ steps.live.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          SUPPLY: ${{ steps.supply.outcome }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          gates = [
              ('Frozen install', os.environ['INSTALL'], '/tmp/install.log'),
              ('Formatting', os.environ['FORMAT'], '/tmp/format.log'),
              ('Lint', os.environ['LINT'], '/tmp/lint.log'),
              ('TypeScript', os.environ['TYPECHECK'], '/tmp/typecheck.log'),
              ('Policy gates', os.environ['POLICIES'], '/tmp/policies.log'),
              ('Automated tests', os.environ['TESTS'], '/tmp/tests.log'),
              ('Live official artifacts', os.environ['LIVE'], '/tmp/live.log'),
              ('Production build', os.environ['BUILD'], '/tmp/build.log'),
              ('Pages artifact', os.environ['PAGES'], '/tmp/pages.log'),
              ('Licenses and advisories', os.environ['SUPPLY'], '/tmp/supply.log'),
          ]
          success = all(outcome == 'success' for _, outcome, _ in gates)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tests = Path('/tmp/tests.log').read_text(encoding='utf-8', errors='replace') if Path('/tmp/tests.log').exists() else ''
          files = re.findall(r'Test Files\s+(\d+) passed', tests)
          count = re.findall(r'Tests\s+(\d+) passed', tests)
          lines = [
              '# ExpressLRS TX/RX software certification',
              '',
              f'- Candidate SHA: `{head}`',
              f'- Software certification: `{"PASS" if success else "FAIL"}`',
              f'- Test files passed: `{files[-1] if files else "UNKNOWN"}`',
              f'- Tests passed: `{count[-1] if count else "UNKNOWN"}`',
              '- Hardware validation: `NONE`',
              '- Physical RF bind proven: `NO`',
              '- Stable public writes enabled: `NO`',
              '',
              '| Gate | Result |',
              '|---|---|',
          ]
          for name, outcome, _ in gates:
              lines.append(f'| {name} | `{outcome.upper()}` |')
          lines.extend([
              '',
              '## Feature comparison with official ExpressLRS Web Flasher',
              '',
              '| Feature | Status |',
              '|---|---|',
              '| Official releases and branches | Implemented |',
              '| Official vendors, bands, and TX/RX Targets | Implemented |',
              '| Regulatory domains | Implemented with explicit selection |',
              '| Binding phrase UID | Implemented |',
              '| TX options | Implemented |',
              '| RX options | Implemented |',
              '| Target-specific Firmware generation | Implemented |',
              '| Firmware and recovery download | Implemented |',
              '| Target-specific Lua | Implemented |',
              '| Direct UART / Espressif | Software implemented |',
              '| EdgeTX passthrough | Software implemented |',
              '| Flight-controller passthrough | Software implemented |',
              '| STM32 XMODEM | Software implemented |',
              '| Wi-Fi update | Prepared image + local-device handoff |',
              '| CRSF settings write/read-back | Implemented |',
              '| Settings backup and restore | Implemented |',
              '| Bind | Implemented; RF result still needs physical observation |',
              '| Recovery checkpoint and package | Implemented |',
              '| Post-write Target + version/commit verification | Implemented |',
              '| Internal ST-Link/WebUSB | Not certified in this candidate |',
              '| Backpack / VRX | Outside current TX/RX scope |',
          ])
          if not success:
              lines.extend(['', '## Failed gate tails', ''])
              for name, outcome, log in gates:
                  if outcome == 'success':
                      continue
                  path = Path(log)
                  tail = path.read_text(encoding='utf-8', errors='replace').splitlines()[-120:] if path.exists() else ['No log produced.']
                  lines.extend([f'### {name}', '', '```text', *tail, '```', ''])
          report = Path('docs/testing/expresslrs-feature-parity-validation.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          marker = Path('docs/testing/EXPRESSLRS_TX_RX_SOFTWARE_PARITY_READY')
          if success:
              marker.write_text(head + '\n', encoding='utf-8')
          else:
              marker.unlink(missing_ok=True)
          Path('/tmp/certification-result').write_text('1' if success else '0', encoding='utf-8')
          PY

      - name: Commit certification evidence
        if: always()
        run: |
          result="$(cat /tmp/certification-result)"
          if [ "$result" = "1" ]; then
            rm -f .github/workflows/m2-parity-release-candidate.yml
            rm -f .github/workflows/m2-parity-green-v1.yml
            rm -f .github/workflows/m2-parity-final-report.yml
            rm -f .github/workflows/m2-write-path-fixups.yml
            rm -f .github/workflows/m2-write-path-hardening.yml
            rm -f .github/workflows/m2-parity-normalize.yml
            rm -f .github/workflows/m2-parity-authoritative.yml
            rm -f .github/workflows/m2-parity-audited-final.yml
            rm -f .github/workflows/m2-parity-repair-v3.yml
            rm -f .github/workflows/m2-parity-repair-v2.yml
            rm -f .github/workflows/m2-parity-finalize.yml
            rm -f .github/workflows/m2-audit-format-export.yml
            message='test(parity): certify ExpressLRS TX/RX software candidate'
          else
            message='test(parity): preserve failed certification evidence'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git fetch origin feat/m2-real-hardware-first-test
            git rebase origin/feat/m2-real-hardware-first-test
            git push origin HEAD:feat/m2-real-hardware-first-test
          fi

      - name: Enforce certification
        if: always()
        run: |
          if [ "$(cat /tmp/certification-result)" != "1" ]; then
            echo '::error::Software certification failed. Exact gate tails were committed to docs/testing/expresslrs-feature-parity-validation.md.'
            exit 1
          fi
