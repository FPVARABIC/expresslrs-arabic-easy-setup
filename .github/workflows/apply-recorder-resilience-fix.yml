name: Apply recorder resilience fix

on:
  push:
    branches:
      - automation/recorder-resilience-fix-2026-09-01
    paths:
      - .github/workflows/apply-recorder-resilience-fix.yml

permissions:
  contents: write

concurrency:
  group: recorder-resilience-fix
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/m2-real-hardware-first-test
  TARGET_HEAD: aebd19706c3321d5621b542bb83c9ce3821ff631
  HELPER_BRANCH: automation/recorder-resilience-fix-2026-09-01

jobs:
  apply:
    name: Test and commit recorder resilience fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Fetch reviewed helper payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${HELPER_BRANCH}:refs/remotes/origin/${HELPER_BRANCH}"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Apply, verify, and push one source commit
        shell: bash
        run: |
          set -euo pipefail
          git show "refs/remotes/origin/${HELPER_BRANCH}:.recorder-fix/apply-recorder-resilience.sh" > /tmp/apply-recorder-resilience.sh
          chmod 0700 /tmp/apply-recorder-resilience.sh
          /tmp/apply-recorder-resilience.sh
