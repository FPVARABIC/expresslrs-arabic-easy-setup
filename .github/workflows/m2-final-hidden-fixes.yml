name: M2 final hidden-gap closure

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-final-hidden-fixes.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: m2-final-hidden-gap-closure
  cancel-in-progress: true

jobs:
  close:
    name: Cancel stale runs, apply final hidden fixes, and certify one candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Cancel stale branch workflows and refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feat%2Fm2-real-hardware-first-test&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\") | .id" \
            | while read -r id; do
                [ -z "$id" ] || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
              done
          sleep 10
          git fetch origin feat/m2-real-hardware-first-test
          git reset --hard origin/feat/m2-real-hardware-first-test

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Pin and install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @elrs-easy/web add fflate@0.8.2 --save-exact
          pnpm install --frozen-lockfile

      - name: Apply final hidden-gap fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding='utf-8')

          # Promote deterministic V2 sources when earlier convergence was cancelled.
          if Path('apps/web/src/main-v2.tsx').exists():
              write('apps/web/src/main.tsx', read('apps/web/src/main-v2.tsx'))
              Path('apps/web/src/main-v2.tsx').unlink()
          v2 = Path('apps/web/src/components/ExpressLrsParityWorkbenchV2.tsx')
          if v2.exists():
              text = v2.read_text(encoding='utf-8')
              text = text.replace(
                  'import { loadOfficialExpressLrsCatalog } from "../hardware/official-catalog";',
                  'import { loadOfficialExpressLrsCatalogV2 } from "../hardware/official-catalog-v2";',
              )
              if 'officialArtifactFetch' not in text:
                  text = text.replace(
                      'import { loadOfficialExpressLrsCatalogV2 } from "../hardware/official-catalog-v2";\n',
                      'import { loadOfficialExpressLrsCatalogV2 } from "../hardware/official-catalog-v2";\nimport { officialArtifactFetch } from "../hardware/official-fetch-adapter";\n',
                      1,
                  )
              text = text.replace(
                  'export function ExpressLrsParityWorkbenchV2()',
                  'export function ExpressLrsParityWorkbench()',
              )
              text = text.replace(
                  'const loaded = await loadOfficialExpressLrsCatalog({',
                  'const loaded = await loadOfficialExpressLrsCatalogV2({',
              )
              text = text.replace(
                  '''        options: packageOptions,
        signal: controller.signal,''',
                  '''        options: packageOptions,
        fetchImplementation: officialArtifactFetch,
        signal: controller.signal,''',
                  1,
              )
              text = text.replace(
                  '''        release: selectedRelease,
        target: selectedTarget,
      });''',
                  '''        release: selectedRelease,
        target: selectedTarget,
        fetchImplementation: officialArtifactFetch,
      });''',
                  1,
              )
              write('apps/web/src/components/ExpressLrsParityWorkbench.tsx', text)
              v2.unlink()
          test_v2 = Path('apps/web/src/components/ExpressLrsParityWorkbenchV2.test.tsx')
          if test_v2.exists():
              text = test_v2.read_text(encoding='utf-8')
              text = text.replace(
                  '"../hardware/official-catalog"',
                  '"../hardware/official-catalog-v2"',
              )
              text = text.replace(
                  'loadOfficialExpressLrsCatalog: mocks.loadCatalog,',
                  'loadOfficialExpressLrsCatalogV2: mocks.loadCatalog,',
              )
              text = text.replace('ExpressLrsParityWorkbenchV2', 'ExpressLrsParityWorkbench')
              text = text.replace(
                  'from "./ExpressLrsParityWorkbenchV2"',
                  'from "./ExpressLrsParityWorkbench"',
              )
              write('apps/web/src/components/ExpressLrsParityWorkbench.test.tsx', text)
              test_v2.unlink()

          # V2 catalog parser.
          catalog = Path('apps/web/src/hardware/official-catalog-v2.ts')
          if catalog.exists():
              text = catalog.read_text(encoding='utf-8')
              text = text.replace(
                  'import { parseOfficialTargetsFlexible } from "./official-target-index";',
                  'import { parseOfficialTargetsV2 } from "./official-target-index-v2";',
              )
              text = text.replace(
                  'const targets = parseOfficialTargetsFlexible(',
                  'const targets = parseOfficialTargetsV2(',
              )
              catalog.write_text(text, encoding='utf-8')

          # Identifier keys remain ASCII/path safe; display names remain Unicode.
          target_parser = Path('apps/web/src/hardware/official-target-index-v2.ts')
          text = target_parser.read_text(encoding='utf-8')
          old = '''  if (
    normalized === null ||
    normalized.includes("..") ||
    /[\\/]/u.test(normalized)
  ) {
    return null;
  }
  return normalized;'''
          new = '''  if (
    normalized === null ||
    normalized.includes("..") ||
    /[\\/]/u.test(normalized) ||
    !/^[A-Za-z0-9_.@+()-]+$/u.test(normalized)
  ) {
    return null;
  }
  return normalized;'''
          text = text.replace(old, new, 1)
          target_parser.write_text(text, encoding='utf-8')

          # Device-provided text and field count are bounded before UI/session use.
          crsf = Path('apps/web/src/hardware/crsf.ts')
          text = crsf.read_text(encoding='utf-8')
          if 'function sanitizeCrsfText' not in text:
              text = text.replace(
                  '''function decodeText(bytes: Uint8Array): string {
  return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
}
''',
                  '''function sanitizeCrsfText(value: string): string {
  return value
    .normalize("NFC")
    .replace(/[\u0000-\u001f\u007f-\u009f]/gu, "")
    .replace(/[\u202a-\u202e\u2066-\u2069]/gu, "")
    .slice(0, 512);
}

function decodeText(bytes: Uint8Array): string {
  return sanitizeCrsfText(
    new TextDecoder("utf-8", { fatal: false }).decode(bytes),
  );
}
''',
                  1,
              )
          text = text.replace(
              '''  if (fieldCount === undefined || parameterVersion === undefined) {
    return null;
  }''',
              '''  if (
    fieldCount === undefined ||
    parameterVersion === undefined ||
    fieldCount > 64
  ) {
    return null;
  }''',
              1,
          )
          crsf.write_text(text, encoding='utf-8')

          # Hidden settings never enter backup or write. Bootloader text is bounded.
          session = Path('apps/web/src/hardware/session.ts')
          text = session.read_text(encoding='utf-8')
          text = text.replace(
              '''      if (parameter.kind !== "number" && parameter.kind !== "selection") {
        return [];
      }''',
              '''      if (
        parameter.hidden ||
        (parameter.kind !== "number" && parameter.kind !== "selection")
      ) {
        return [];
      }''',
              1,
          )
          text = text.replace(
              '''    if (known.kind !== "number" && known.kind !== "selection") {
      throw new ExpressLrsHardwareError(''',
              '''    if (
      known.hidden ||
      (known.kind !== "number" && known.kind !== "selection")
    ) {
      throw new ExpressLrsHardwareError(''',
              1,
          )
          text = text.replace(
              '''      responseText += textDecoder.decode(chunk, { stream: true });
      const line = responseText''',
              '''      responseText += textDecoder.decode(chunk, { stream: true });
      if (responseText.length > 4_096) {
        responseText = responseText.slice(-2_048);
      }
      const line = responseText''',
              1,
          )
          session.write_text(text, encoding='utf-8')

          # Workbench: import proof helper and replace manual-only reconnect success.
          workbench = Path('apps/web/src/components/ExpressLrsParityWorkbench.tsx')
          text = workbench.read_text(encoding='utf-8')
          if 'verifyReconnectTarget' not in text:
              marker = '} from "../hardware/recovery-package";\n'
              text = text.replace(
                  marker,
                  marker + 'import { verifyReconnectTarget } from "../hardware/reconnect-target-verification";\n',
                  1,
              )
          old_target = '''    const targetVerified =
      (match.confidence === "EXACT" && match.selected?.id === input.target.id) ||
      (input.expectedIdentity !== null &&
        samePhysicalIdentity(input.expectedIdentity, outcome.identity)) ||
      input.manualTargetWasConfirmed;
    if (!targetVerified) {'''
          new_target = '''    const targetVerification = verifyReconnectTarget({
      expectedTarget: input.target,
      beforeIdentity: input.expectedIdentity,
      afterIdentity: outcome.identity,
      match,
      manualTargetConfirmed: input.manualTargetWasConfirmed,
    });
    if (!targetVerification.verified) {'''
          text = text.replace(old_target, new_target, 1)
          # Remove now-unused local helper when it is no longer referenced.
          if text.count('samePhysicalIdentity(') == 1:
              start = text.find('function samePhysicalIdentity(')
              end = text.find('\n}\n\nasync function sha256Hex', start)
              if start >= 0 and end >= 0:
                  text = text[:start] + text[end + 3:]
          # Reloading official data invalidates the old session.
          marker = '''  async function loadCatalog(): Promise<void> {
    catalogAbortRef.current?.abort();'''
          text = text.replace(
              marker,
              '''  async function loadCatalog(): Promise<void> {
    await disconnectHardware();
    catalogAbortRef.current?.abort();''',
              1,
          )
          # Vendor/radio changes update method from the newly selected Target.
          vendor_block = '''                setVendorKey(nextVendor);
                setRadioKey(nextRadio);
                setTargetId(nextTarget?.id ?? "");
                setManualTargetConfirmation("");'''
          vendor_new = '''                setVendorKey(nextVendor);
                setRadioKey(nextRadio);
                setTargetId(nextTarget?.id ?? "");
                const nextMethods = nextTarget?.config.uploadMethods ?? [];
                setMethod(
                  nextMethods.includes("uart")
                    ? "uart"
                    : (nextMethods[0] ?? "download"),
                );
                setManualTargetConfirmation("");'''
          text = text.replace(vendor_block, vendor_new, 1)
          radio_block = '''                setRadioKey(nextRadio);
                setTargetId(nextTarget?.id ?? "");
                setManualTargetConfirmation("");'''
          radio_new = '''                setRadioKey(nextRadio);
                setTargetId(nextTarget?.id ?? "");
                const nextMethods = nextTarget?.config.uploadMethods ?? [];
                setMethod(
                  nextMethods.includes("uart")
                    ? "uart"
                    : (nextMethods[0] ?? "download"),
                );
                setManualTargetConfirmation("");'''
          text = text.replace(radio_block, radio_new, 1)
          # Empty/NaN values never become an implicit zero.
          text = text.replace(
              '''    const requestedValue = Number(settingDraft);
    setBusy(true);''',
              '''    if (
      settingDraft.trim().length === 0 ||
      !Number.isSafeInteger(Number(settingDraft))
    ) {
      setStatus("أدخل قيمة صحيحة ضمن حدود الإعداد قبل الحفظ.");
      return;
    }
    const requestedValue = Number(settingDraft);
    setBusy(true);''',
              1,
          )
          # Recovery requires a real writer.
          text = text.replace(
              '''    setBusy(true);
    setStatus("جارٍ فحص حزمة الاستعادة وSHA-256 لكل قطاع…");''',
              '''    if (method === "wifi" || method === "download") {
      setStatus("اختر UART أو Passthrough أو ST-Link لتشغيل الاستعادة.");
      return;
    }
    setBusy(true);
    setStatus("جارٍ فحص حزمة الاستعادة وSHA-256 لكل قطاع…");''',
              1,
          )
          workbench.write_text(text, encoding='utf-8')

          # Firmware option and OTA/application semantics.
          firmware = Path('apps/web/src/hardware/firmware-package.ts')
          text = firmware.read_text(encoding='utf-8')
          if './firmware-options' not in text:
              text = text.replace(
                  'import { expressLrsBindingUid } from "./bind-phrase";\n',
                  'import { expressLrsBindingUid } from "./bind-phrase";\nimport { validateFirmwareOptions } from "./firmware-options";\n',
                  1,
              )
          start = text.find('export async function prepareOfficialFirmwarePackage(')
          end = text.find('\nexport function downloadPreparedBytes', start)
          if start >= 0 and end >= 0:
              segment = text[start:end]
              if 'const validatedOptions = validateFirmwareOptions' not in segment:
                  segment = segment.replace('input.options', 'validatedOptions')
                  segment = segment.replace(
                      '): Promise<PreparedFirmwarePackage> {\n',
                      '''): Promise<PreparedFirmwarePackage> {
  const validatedOptions = validateFirmwareOptions({
    target: input.target,
    options: input.options,
  });
''',
                      1,
                  )
                  text = text[:start] + segment + text[end:]
          primary_start = text.find('  let primaryDownload: Uint8Array;')
          primary_end = text.find('\n  const recoveryManifest', primary_start)
          if primary_start >= 0 and primary_end >= 0:
              primary = '''  let primaryDownload: Uint8Array;
  let primaryFileName: string;
  let primaryMimeType: string;
  if (
    family === "esp" &&
    (input.target.config.platform.toLocaleLowerCase("en-US").includes("8285") ||
      input.target.config.platform.toLocaleLowerCase("en-US").includes("8266"))
  ) {
    primaryDownload = gzipSync(configuredApplication, { level: 9 });
    primaryFileName = "firmware.bin.gz";
    primaryMimeType = "application/gzip";
  } else {
    primaryDownload = configuredApplication.slice();
    primaryFileName = "firmware.bin";
    primaryMimeType = "application/octet-stream";
  }
'''
              text = text[:primary_start] + primary + text[primary_end:]
          text = text.replace(
              'bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)',
              'bytes.slice().buffer',
          )
          text = text.replace('new Blob([bytes],', 'new Blob([bytes.slice().buffer],')
          firmware.write_text(text, encoding='utf-8')

          # Binding phrase validator mirrors UID implementation limits.
          options = Path('apps/web/src/hardware/firmware-options.ts')
          text = options.read_text(encoding='utf-8')
          marker = '  const bindPhrase = boundedText("bindPhrase", options.bindPhrase, 192, true);'
          if marker in text and 'exceeds 128 Unicode characters' not in text:
              text = text.replace(
                  marker,
                  marker + '''
  if ([...bindPhrase].length > 128) {
    throw new FirmwareOptionsError(
      "bindPhrase",
      "Binding phrase exceeds 128 Unicode characters",
    );
  }''',
                  1,
              )
          options.write_text(text, encoding='utf-8')

          # DFU readback begins from idle and leave accepts immediate reset.
          dfu = Path('apps/web/src/hardware/stm32-dfu.ts')
          text = dfu.read_text(encoding='utf-8')
          text = text.replace(
              '''      status.state === DfuState.downloadIdle ||
      status.state === DfuState.dfuIdle''',
              '''      status.state === DfuState.downloadIdle ||
      status.state === DfuState.dfuIdle ||
      status.state === DfuState.manifestWaitReset''',
              1,
          )
          marker = '''    await setAddress(
      device,
      selection.interfaceNumber,
      startAddress,
      input.signal,
    );
    for (
      let offset = 0, blockNumber = 2;
      offset < input.segment.bytes.byteLength;
      offset += DEFAULT_TRANSFER_SIZE, blockNumber += 1
    ) {
      ensureActive(input.signal);
      const expected = input.segment.bytes.slice('''
          replacement = '''    await setAddress(
      device,
      selection.interfaceNumber,
      startAddress,
      input.signal,
    );
    await transferOut(device, selection.interfaceNumber, DfuRequest.abort, 0);
    await clearToIdle(device, selection.interfaceNumber, input.signal);
    for (
      let offset = 0, blockNumber = 2;
      offset < input.segment.bytes.byteLength;
      offset += DEFAULT_TRANSFER_SIZE, blockNumber += 1
    ) {
      ensureActive(input.signal);
      const expected = input.segment.bytes.slice('''
          text = text.replace(marker, replacement, 1)
          dfu.write_text(text, encoding='utf-8')

          # Recovery archive and TypeScript 6 BufferSource boundaries.
          recovery = Path('apps/web/src/hardware/recovery-package.ts')
          text = recovery.read_text(encoding='utf-8')
          text = text.replace(
              'crypto.subtle.digest("SHA-256", bytes)',
              'crypto.subtle.digest("SHA-256", bytes.slice().buffer)',
          )
          recovery.write_text(text, encoding='utf-8')
          for relative in [
              'apps/web/src/hardware/recovery-package.test.ts',
              'apps/web/src/hardware/official-catalog.test.ts',
              'apps/web/src/hardware/firmware-package.test.ts',
              'apps/web/src/hardware/lua-package.test.ts',
          ]:
              path = Path(relative)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)',
                  'bytes.slice().buffer',
              )
              text = text.replace(
                  'crypto.subtle.digest("SHA-256", bytes)',
                  'crypto.subtle.digest("SHA-256", bytes.slice().buffer)',
              )
              text = text.replace('new Response(hardwareZip, {', 'new Response(hardwareZip.slice().buffer, {')
              text = text.replace('new Response(firmware)', 'new Response(firmware.slice().buffer)')
              text = text.replace('new Response(archive)', 'new Response(archive.slice().buffer)')
              text = text.replace(
                  'expect(result.primaryFileName).toBe("firmware-package.zip");',
                  'expect(result.primaryFileName).toBe("firmware.bin");',
              )
              text = text.replace(
                  'expect(result.primaryMimeType).toBe("application/zip");',
                  'expect(result.primaryMimeType).toBe("application/octet-stream");',
              )
              path.write_text(text, encoding='utf-8')

          # Live loader, regulatory names, CSP, and primary gate.
          live = Path('apps/web/src/hardware/official-catalog.live.test.ts')
          if live.exists():
              text = live.read_text(encoding='utf-8')
              text = text.replace('loadOfficialExpressLrsCatalog', 'loadOfficialExpressLrsCatalogV2')
              text = text.replace('from "./official-catalog"', 'from "./official-catalog-v2"')
              live.write_text(text, encoding='utf-8')
          for relative in [
              'apps/web/src/hardware/regulatory-domain.ts',
              'apps/web/src/hardware/regulatory-domain.test.ts',
          ]:
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              text = text.replace('FCC_2400', 'ISM_2400').replace('US_433', 'FCC_433').replace('US 433 MHz', 'FCC 433 MHz')
              path.write_text(text, encoding='utf-8')
          for relative in ['apps/web/public/_headers', 'apps/web/index.html']:
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if 'connect-src' in text and 'artifactory.expresslrs.org' not in text:
                  text = text.replace(
                      "connect-src 'self'",
                      "connect-src 'self' https://artifactory.expresslrs.org https://expresslrs.github.io",
                  )
              path.write_text(text, encoding='utf-8')

          Path('scripts/check-real-hardware-primary.mjs').write_text(
              '''import { readFile } from "node:fs/promises";
const main = await readFile("apps/web/src/main.tsx", "utf8");
const workbench = await readFile("apps/web/src/components/ExpressLrsParityWorkbench.tsx", "utf8");
const failures = [];
if (!main.includes("ExpressLrsParityWorkbench")) failures.push("real workbench missing from main");
for (const forbidden of ['from "./App"', "DeviceConnectionHub", "mockScenarios", "runFoundationDemo"]) {
  if (main.includes(forbidden)) failures.push(`legacy path: ${forbidden}`);
}
for (const required of [
  "loadOfficialExpressLrsCatalogV2",
  "ExpressLrsHardwareSession.connect",
  "writeParameter",
  "restoreSettingsBackup",
  "startBinding",
  "prepareOfficialFirmwarePackage",
  "flashEspFirmware",
  "flashXmodemFirmware",
  "flashStm32DfuFirmware",
  "validateRecoveryPackage",
  "verifyObservedFirmwareBuild",
  "verifyReconnectTarget",
  "reconnectAndVerify",
]) {
  if (!workbench.includes(required)) failures.push(`missing ${required}`);
}
if (failures.length) {
  console.error(failures.join("\\n"));
  process.exit(1);
}
console.log("Real hardware primary-path gate passed.");
''',
              encoding='utf-8',
          )
          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['check:real-hardware-primary'] = 'node scripts/check-real-hardware-primary.mjs'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          print('Final hidden-gap source patch applied.')
          PY

      - name: Format and run every gate
        env:
          EXPRESSLRS_LIVE_CATALOG: "1"
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm check:boundaries
          pnpm check:security-headers
          pnpm check:pwa-safety
          pnpm check:visual-theme
          pnpm check:links
          pnpm check:master-plan
          pnpm check:real-hardware-primary
          pnpm test
          pnpm exec vitest run \
            apps/web/src/hardware/official-catalog.live.test.ts \
            apps/web/src/hardware/official-artifacts.live.test.ts
          pnpm build
          GITHUB_PAGES=true PAGES_BASE_PATH=/expresslrs-arabic-easy-setup/ pnpm --filter @elrs-easy/web build
          pnpm check:pages-build
          pnpm licenses:report
          pnpm licenses:check
          pnpm security:audit

      - name: Record green candidate
        run: |
          mkdir -p docs/testing
          head_sha="$(git rev-parse HEAD)"
          cat > docs/testing/expresslrs-feature-parity-validation.md <<EOF
          # Final ExpressLRS TX/RX software parity certification

          - Input SHA: \`${head_sha}\`
          - Software result: \`PASS\`
          - Hardware validation: \`NONE\`
          - Stable public writes enabled: \`NO\`

          All formatting, lint, TypeScript, policy, unit/integration, live official-source,
          production build, Pages artifact, license, and high-severity advisory gates passed.

          Implemented TX/RX scope: official releases/Targets/domains/options, Firmware/OTA/Lua,
          CRSF settings and Bind, UART Espressif, EdgeTX and flight-controller passthrough,
          STM32 XMODEM, STM32 WebUSB DFU, mandatory recovery, pre-write identity, and
          post-write Target plus release-version/branch-commit verification.

          Backpack/VRX and physical hardware evidence remain outside this checkpoint.
          EOF
          printf '%s\n' "$head_sha" > docs/testing/EXPRESSLRS_TX_RX_SOFTWARE_PARITY_READY
          rm -f .github/workflows/m2-final-hidden-fixes.yml
          rm -f .github/workflows/m2-final-converge-v2.yml
          rm -f .github/workflows/m2-v2-certify.yml
          rm -f .github/workflows/m2-v2-switch.yml
          rm -f .github/workflows/m2-certify-all.yml
          rm -f .github/workflows/m2-stm32-dfu-integrate.yml
          rm -f .github/workflows/m2-parity-release-candidate.yml
          rm -f .github/workflows/m2-parity-green-v1.yml
          rm -f .github/workflows/m2-parity-final-report.yml
          rm -f .github/workflows/m2-write-path-fixups.yml
          rm -f .github/workflows/m2-write-path-hardening.yml
          rm -f .github/workflows/m2-parity-normalize.yml
          rm -f .github/workflows/m2-parity-authoritative.yml
