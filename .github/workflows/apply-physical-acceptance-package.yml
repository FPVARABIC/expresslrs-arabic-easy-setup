# Retry 2: corrected the formatted step-definition integrity check.
name: Apply physical acceptance package

on:
  push:
    branches:
      - automation/physical-acceptance-package-2026-09-01
    paths:
      - .github/workflows/apply-physical-acceptance-package.yml

permissions:
  contents: write

concurrency:
  group: physical-acceptance-package
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/m2-real-hardware-first-test
  TARGET_HEAD: 2d492efd2f94267f26cbdce900e5ab1aa1ff4375
  HELPER_BRANCH: automation/physical-acceptance-package-2026-09-01

jobs:
  apply:
    name: Build, test, and commit the physical acceptance recorder
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact target candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Fetch reviewed helper payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${HELPER_BRANCH}:refs/remotes/origin/${HELPER_BRANCH}"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Apply, test, and push one source commit
        shell: bash
        run: |
          set -euo pipefail
          git show "refs/remotes/origin/${HELPER_BRANCH}:.physical-acceptance/apply-physical-acceptance.sh" > /tmp/apply-physical-acceptance.sh
          chmod 0700 /tmp/apply-physical-acceptance.sh
          /tmp/apply-physical-acceptance.sh
