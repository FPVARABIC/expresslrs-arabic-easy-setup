name: M2 final expert user audit

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-final-user-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m2-final-expert-user-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Repair, stress-test, document, and commit
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact hardware branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final audited resource-safety repairs
        run: python scripts/m2-final-audit-repair.py

      - name: Format the complete candidate
        run: pnpm format

      - name: Run formatting, lint, and type gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck

      - name: Run architecture and product invariants
        run: |
          pnpm check:boundaries
          pnpm check:security-headers
          pnpm check:pwa-safety
          pnpm check:visual-theme
          pnpm check:links
          pnpm check:master-plan
          pnpm check:hardware-journey

      - name: Run focused hostile-device and user-failure tests
        run: |
          pnpm --filter @elrs-easy/web test -- \
            transport-hardening.test.ts \
            protocol-resource-regressions.test.ts \
            session-failure-regressions.test.ts \
            session.test.ts \
            userSession.test.ts \
            DeviceConnectionHub.test.tsx

      - name: Run complete automated suite
        run: pnpm test | tee /tmp/final-tests.log

      - name: Build production and Pages candidates
        run: pnpm build

      - name: Verify the Pages build separately
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /expresslrs-arabic-easy-setup/
        run: |
          pnpm --filter @elrs-easy/web build
          pnpm check:pages-build

      - name: Run license and dependency-security gates
        run: |
          pnpm licenses:report
          pnpm licenses:check
          pnpm security:audit

      - name: Record the audited result
        run: |
          TEST_FILES=$(sed -nE 's/.*Test Files[[:space:]]+([0-9]+) passed.*/\1/p' /tmp/final-tests.log | tail -n1)
          TESTS=$(sed -nE 's/.*Tests[[:space:]]+([0-9]+) passed.*/\1/p' /tmp/final-tests.log | tail -n1)
          SOURCE_SHA=$(git rev-parse HEAD)
          mkdir -p docs/testing
          cat > docs/testing/hardware-user-journey-final-audit.md <<EOF
          # Final expert and user audit of the hardware journey

          - Source SHA audited before the report commit: \`${SOURCE_SHA}\`
          - Automated result: \`PASS\`
          - Test files passed: \`${TEST_FILES:-not-parsed}\`
          - Tests passed: \`${TESTS:-not-parsed}\`
          - Physical hardware observation: \`NONE\`
          - Public stable hardware writes: \`DISABLED\`

          ## User journeys exercised

          - Web Serial unsupported, insecure context, permission denied, chooser cancellation, open failure, and absent streams.
          - Correct CRSF transport settings, Ping, CRC-valid Device Info, TX/RX mismatch, malformed Device Info, and hostile input chunks.
          - Partial Reader/Writer lock acquisition, write failure, unexpected EOF, repeated close, and transient close failure.
          - Complete parameter enumeration, hidden-parameter exclusion, reversible backup, exact write/read-back, ignored write, and restore identity mismatch.
          - TX command execution and Bind acknowledgement without mislabelling it as RF-link proof.
          - Arabic/English distinction between real CRSF operations, simulation cards, and firmware operations that are still gated.
          - Production build, GitHub Pages base path, PWA cache boundaries, headers, dependency licenses, and high-severity advisory policy.

          ## Corrections made

          1. Replaced transport-open-only success semantics with protocol identity evidence.
          2. Removed synchronous dependent form-state cascades and isolated connection timing from React render purity.
          3. Bounded serial chunks before allocation and replaced quadratic byte-by-byte CRSF resynchronization with a cursor-based parser.
          4. Made malformed device-controlled Device Info fail closed.
          5. Bounded legacy Bind and Bootloader target keys to a single CRSF frame.
          6. Rolled back partial stream-lock acquisition and made EOF/read failure release all browser resources.
          7. Serialized concurrent closes while allowing a retry after a transient port-close failure.
          8. Consumed cancelled frame waiters on write failure to prevent unhandled rejections.
          9. Rejected impossible VID/PID values as invalid hardware evidence.
          10. Kept hidden parameters out of backup/write paths and refused success when read-back retained the old value.
          11. Added a permanent CI gate against regressions to 115200 or transport-open-only behavior.

          ## Evidence boundary

          This PASS certifies the reviewed software behavior, automated browser/protocol emulation, cleanup, bounds, failure semantics, production build, and policy gates. It does not certify an electrical UART path, RF binding, bootloader entry, firmware writing, reboot verification, or recovery on a commercial TX/RX. Those require the first physical hardware session and remain \`HARDWARE_OBSERVED = NONE\`.
          EOF
          pnpm format
          pnpm format:check

      - name: Remove one-shot audit machinery
        run: |
          rm -f scripts/m2-final-audit-repair.py
          rm -f .github/workflows/m2-final-user-audit.yml
          rm -f .github/workflows/m2-user-journey-audit-repair.yml
          rm -f scripts/m2-user-journey-audit-repair.py
          rm -f .github/workflows/m2-audit-format-export.yml

      - name: Commit the fully verified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hardware): complete expert user-journey hardening audit"
          git push origin HEAD:feat/m2-real-hardware-first-test
