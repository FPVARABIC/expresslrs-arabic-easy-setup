name: M2 real write-path hardening

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-write-path-hardening.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: m2-real-write-hardening
  cancel-in-progress: true

jobs:
  harden:
    name: Harden package snapshots, prewrite identity, and postwrite version
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out latest branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Cancel stale runs and refresh head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feat%2Fm2-real-hardware-first-test&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\") | .id" \
            | while read -r id; do
                [ -z "$id" ] || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
              done
          sleep 6
          git fetch origin feat/m2-real-hardware-first-test
          git reset --hard origin/feat/m2-real-hardware-first-test

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @elrs-easy/web add fflate@0.8.2 --save-exact

      - name: Apply real write-path hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Validate all option values before selecting or mutating firmware bytes.
          path = Path('apps/web/src/hardware/firmware-package.ts')
          text = path.read_text(encoding='utf-8')
          if './firmware-options' not in text:
              marker = 'import { expressLrsBindingUid } from "./bind-phrase";\n'
              text = text.replace(
                  marker,
                  marker + 'import { validateFirmwareOptions } from "./firmware-options";\n',
                  1,
              )
          function_start = text.find('export async function prepareOfficialFirmwarePackage(')
          function_end = text.find('\nexport function downloadPreparedBytes', function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit('Firmware package function boundaries were not found')
          segment = text[function_start:function_end]
          if 'const validatedOptions = validateFirmwareOptions' not in segment:
              segment = segment.replace('input.options', 'validatedOptions')
              body_marker = '): Promise<PreparedFirmwarePackage> {\n'
              segment = segment.replace(
                  body_marker,
                  body_marker + '''  const validatedOptions = validateFirmwareOptions({
    target: input.target,
    options: input.options,
  });
''',
                  1,
              )
          text = text[:function_start] + segment + text[function_end:]

          # Check actual decompressed byte sizes instead of trusting ZIP headers alone.
          if 'actualUncompressedBytes' not in text:
              marker = '''  return Object.freeze(
    Object.fromEntries(
      Object.entries(entries).map(([name, bytes]) => [
        normalizedPath(name),
        bytes,
      ]),
    ),
  );'''
              replacement = '''  let actualUncompressedBytes = 0;
  for (const [name, bytes] of Object.entries(entries)) {
    if (bytes.byteLength > input.maximumEntryBytes) {
      throw new FirmwarePackageError(
        "ARCHIVE",
        `Archive entry ${name} exceeds its actual byte limit`,
      );
    }
    actualUncompressedBytes += bytes.byteLength;
    if (actualUncompressedBytes > input.maximumTotalBytes) {
      throw new FirmwarePackageError(
        "ARCHIVE",
        "Decompressed archive entries exceed their actual total byte limit",
      );
    }
  }
  return Object.freeze(
    Object.fromEntries(
      Object.entries(entries).map(([name, bytes]) => [
        normalizedPath(name),
        bytes,
      ]),
    ),
  );'''
              if marker not in text:
                  raise SystemExit('ZIP post-decompression marker was not found')
              text = text.replace(marker, replacement, 1)

          if 'function archivePathMatches' not in text:
              marker = '''function canonical(value: string): string {
  return value.trim().toLocaleLowerCase("en-US").replace(/[^a-z0-9]+/gu, "");
}
'''
              replacement = marker + '''
function archivePathMatches(name: string, expected: string): boolean {
  const actualPath = normalizedPath(name).toLocaleLowerCase("en-US");
  const expectedPath = normalizedPath(expected).toLocaleLowerCase("en-US");
  return actualPath === expectedPath || actualPath.endsWith(`/${expectedPath}`);
}
'''
              text = text.replace(marker, replacement, 1)
          text = text.replace(
              '''(name) => canonical(name.split("/").at(-1) ?? "") === wanted,''',
              '''(name) =>
        archivePathMatches(name, target.config.layoutFile ?? wanted),''',
          )
          text = text.replace(
              '''(name) => canonical(name.split("/").at(-1) ?? "") === wanted,
  );''',
              '''(name) => archivePathMatches(name, target.config.logoFile ?? wanted),
  );''',
          )
          text = text.replace(
              '''  const path = normalizedPath(value);
  return (
    path.length > 0 &&''',
              '''  if (/^(?:[A-Za-z]:|[\\/])/u.test(value)) return false;
  const path = normalizedPath(value);
  return (
    path.length > 0 &&''',
              1,
          )
          text = text.replace(
              '''  anchor.click();
  queueMicrotask(() => URL.revokeObjectURL(url));''',
              '''  anchor.hidden = true;
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1_000);''',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Do not decompress a forged huge targets.json based only on its central-directory claim.
          path = Path('apps/web/src/hardware/official-catalog.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''      filter(file) {
        return /(^|\\/)targets\\.json$/iu.test(file.name);
      },''',
              '''      filter(file) {
        return (
          /(^|\\/)targets\\.json$/iu.test(file.name) &&
          file.originalSize <= MAX_TARGET_JSON_BYTES
        );
      },''',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Add an in-session identity recheck immediately before any bootloader transition.
          path = Path('apps/web/src/hardware/session.ts')
          text = path.read_text(encoding='utf-8')
          if '"IDENTITY_CHANGED"' not in text:
              text = text.replace(
                  '      | "BINDING_NOT_ACKNOWLEDGED",',
                  '      | "BINDING_NOT_ACKNOWLEDGED"\n      | "IDENTITY_CHANGED",',
                  1,
              )
          if 'public async verifyCurrentIdentity' not in text:
              marker = '''  public get parameters(): readonly CrsfParameter[] {
    return Object.freeze(
      [...this.#parameters.values()].sort((left, right) => left.id - right.id),
    );
  }
'''
              method = marker + '''
  public async verifyCurrentIdentity(
    signal?: AbortSignal,
  ): Promise<ExpressLrsIdentity> {
    this.#assertOpen();
    const frame = await this.#link.request(
      createDevicePing(this.#identity.requestOrigin),
      (candidate) => {
        const parsed = parseCrsfDeviceInfo(candidate);
        return (
          parsed !== null &&
          parsed.expressLrsMarkerValid &&
          parsed.origin === this.#identity.address
        );
      },
      { timeoutMs: 2_000, signal },
    );
    const parsed = parseCrsfDeviceInfo(frame);
    if (parsed === null) {
      throw new ExpressLrsHardwareError(
        "IDENTITY_CHANGED",
        "The device did not return a valid identity before writing",
      );
    }
    const actual = identityFromDeviceInfo(
      parsed,
      this.#identity.role,
      this.#identity.usb,
    );
    if (!sameIdentity(this.#identity, actual)) {
      throw new ExpressLrsHardwareError(
        "IDENTITY_CHANGED",
        "The connected device identity changed before writing",
      );
    }
    return actual;
  }
'''
              if marker not in text:
                  raise SystemExit('Session identity method insertion marker was not found')
              text = text.replace(marker, method, 1)
          path.write_text(text, encoding='utf-8')

          # Primary UX: immutable option snapshot, explicit power/antenna acknowledgement,
          # prewrite identity, and postwrite version verification.
          path = Path('apps/web/src/components/ExpressLrsParityWorkbench.tsx')
          text = path.read_text(encoding='utf-8')
          if 'verifyObservedFirmwareVersion' not in text:
              marker = 'import { flashXmodemFirmware } from "../hardware/xmodem";\n'
              text = text.replace(
                  marker,
                  'import { verifyObservedFirmwareVersion } from "../hardware/version-verification";\n' + marker,
                  1,
              )
          if 'const optionsRevision = useRef(0);' not in text:
              marker = '  const operationAbort = useRef<AbortController | null>(null);\n'
              text = text.replace(
                  marker,
                  marker + '  const optionsRevision = useRef(0);\n',
                  1,
              )
          if 'const [powerAcknowledged' not in text:
              marker = '  const [checkpoint, setCheckpoint] = useState<RecoveryCheckpoint | null>(null);\n'
              text = text.replace(
                  marker,
                  marker + '''  const [powerAcknowledged, setPowerAcknowledged] = useState(false);
  const [antennaAcknowledged, setAntennaAcknowledged] = useState(false);
''',
                  1,
              )
          if 'beforeunload' not in text:
              marker = '''  useEffect(() => {
    let active = true;'''
              guard = '''  useEffect(() => {
    if (!busy) return undefined;
    const preventNavigation = (event: BeforeUnloadEvent) => {
      event.preventDefault();
      event.returnValue = "";
    };
    window.addEventListener("beforeunload", preventNavigation);
    return () => window.removeEventListener("beforeunload", preventNavigation);
  }, [busy]);

'''
              text = text.replace(marker, guard + marker, 1)
          text = text.replace(
              '''        {busy ? (
          <button type="button" onClick={() => operationAbort.current?.abort()}>
            إلغاء العملية
          </button>
        ) : null}''',
              '''        {busy &&
        (operationAbort.current !== null || catalogAbort.current !== null) ? (
          <button
            type="button"
            onClick={() => {
              operationAbort.current?.abort();
              catalogAbort.current?.abort();
            }}
          >
            إلغاء العملية
          </button>
        ) : null}''',
              1,
          )
          build_marker = '''    setBusy(true);
    setPrepared(null);
    setRecoveryDownloaded(false);'''
          if build_marker in text and 'const buildOptionsRevision' not in text:
              text = text.replace(
                  build_marker,
                  '''    const buildOptionsRevision = optionsRevision.current;
    setBusy(true);
    setPrepared(null);
    setRecoveryDownloaded(false);''',
                  1,
              )
              text = text.replace(
                  '''      setPrepared(result);
      setStatus(''',
                  '''      if (optionsRevision.current !== buildOptionsRevision) {
        setStatus(
          "تغيرت خيارات Firmware أثناء البناء؛ تم تجاهل الحزمة القديمة.",
        );
        return;
      }
      setPrepared(result);
      setPowerAcknowledged(false);
      setAntennaAcknowledged(false);
      setStatus(''',
                  1,
              )
          text = text.replace(
              '''    setOptions((current) => ({ ...current, [key]: value }));
    setPrepared(null);''',
              '''    optionsRevision.current += 1;
    setOptions((current) => ({ ...current, [key]: value }));
    setPrepared(null);''',
              1,
          )
          text = text.replace(
              '''    setRecoveryDownloaded(false);
  }''',
              '''    setRecoveryDownloaded(false);
    setPowerAcknowledged(false);
    setAntennaAcknowledged(false);
  }''',
              1,
          )

          # Extend reconnect verification with the selected release.
          text = text.replace(
              'async function reconnectAndVerify(target: OfficialTarget): Promise<void> {',
              'async function reconnectAndVerify(\n    target: OfficialTarget,\n    release: NonNullable<typeof selectedRelease>,\n  ): Promise<void> {',
              1,
          )
          version_marker = '''    if (match.confidence !== "EXACT" || match.selected?.id !== target.id) {
      await outcome.session.close();
      throw new Error("عاد جهاز بعد التفليش، لكن هويته لا تطابق Target المتوقع");
    }'''
          if version_marker in text and 'verifyObservedFirmwareVersion' not in text[text.find(version_marker):text.find(version_marker)+1200]:
              text = text.replace(
                  version_marker,
                  version_marker + '''
    const versionVerification = verifyObservedFirmwareVersion({
      release,
      observedVersion: outcome.identity.firmwareVersion,
    });
    if (!versionVerification.verified) {
      await outcome.session.close();
      throw new Error(
        `عاد Target الصحيح، لكن الإصدار ${versionVerification.observed} لا يطابق ${versionVerification.expected}`,
      );
    }''',
                  1,
              )
          text = text.replace(
              'await reconnectAndVerify(selectedTarget);',
              'await reconnectAndVerify(selectedTarget, prepared.release);',
          )
          text = text.replace(
              'await reconnectAndVerify(selectedTarget);',
              'await reconnectAndVerify(selectedTarget, {\n        label: validated.releaseLabel,\n        revision: validated.releaseRevision,\n        channel: /^v?\\d+\\.\\d+\\.\\d+/u.test(validated.releaseLabel)\n          ? "release"\n          : "branch",\n      });',
          )

          # Verify the still-connected CRSF identity at the point of no return.
          marker = '''        const session = sessionRef.current;
        if (session === null) throw new Error("جلسة CRSF أغلقت قبل التفليش");
        await updateCheckpoint(prepared, "BOOTLOADER");'''
          if marker in text and 'verifyCurrentIdentity' not in text[text.find(marker):text.find(marker)+800]:
              text = text.replace(
                  marker,
                  '''        const session = sessionRef.current;
        if (session === null) throw new Error("جلسة CRSF أغلقت قبل التفليش");
        const liveIdentity = await session.verifyCurrentIdentity(controller.signal);
        const liveMatch = matchHardwareIdentityToOfficialTargets({
          identity: liveIdentity,
          targets: catalog?.targets ?? [],
        });
        if (
          liveMatch.confidence !== "EXACT" ||
          liveMatch.selected?.id !== selectedTarget.id
        ) {
          throw new Error("تغيرت هوية الجهاز أو Target قبل الكتابة");
        }
        await updateCheckpoint(prepared, "BOOTLOADER");''',
                  1,
              )

          # Explicit user acknowledgements immediately next to the write button.
          if 'ثبات الطاقة أثناء التفليش' not in text:
              marker = '''            <button type="button" className="danger-button"'''
              acknowledgements = '''            <div className="flash-acknowledgements">
              <label className="check-field">
                <input
                  type="checkbox"
                  checked={powerAcknowledged}
                  onChange={(event) =>
                    setPowerAcknowledged(event.currentTarget.checked)
                  }
                />
                <span>ثبات الطاقة أثناء التفليش</span>
              </label>
              {selectedTarget?.role === "tx" ? (
                <label className="check-field">
                  <input
                    type="checkbox"
                    checked={antennaAcknowledged}
                    onChange={(event) =>
                      setAntennaAcknowledged(event.currentTarget.checked)
                    }
                  />
                  <span>هوائي جهاز الإرسال مثبت</span>
                </label>
              ) : null}
            </div>
'''
              if marker not in text:
                  raise SystemExit('Danger button insertion marker was not found')
              text = text.replace(marker, acknowledgements + marker, 1)
          # Extend the existing disabled expression conservatively.
          text = text.replace(
              '''disabled={busy || !recoveryDownloaded || selectedTarget === null ||''',
              '''disabled={
                busy ||
                !recoveryDownloaded ||
                !powerAcknowledged ||
                (selectedTarget?.role === "tx" && !antennaAcknowledged) ||
                selectedTarget === null ||''',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # A small layout for acknowledgements.
          path = Path('apps/web/src/parity-workbench.css')
          text = path.read_text(encoding='utf-8')
          if '.flash-acknowledgements' not in text:
              text += '''

.flash-acknowledgements {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.65rem;
  margin-block-start: 0.85rem;
}

@media (max-width: 600px) {
  .flash-acknowledgements {
    grid-template-columns: 1fr;
  }
}
'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and run every gate
        env:
          EXPRESSLRS_LIVE_CATALOG: "1"
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm check:boundaries
          pnpm check:security-headers
          pnpm check:pwa-safety
          pnpm check:visual-theme
          pnpm check:links
          pnpm check:master-plan
          pnpm check:real-hardware-primary
          pnpm test
          pnpm exec vitest run \
            apps/web/src/hardware/official-catalog.live.test.ts \
            apps/web/src/hardware/official-artifacts.live.test.ts
          pnpm build
          GITHUB_PAGES=true PAGES_BASE_PATH=/expresslrs-arabic-easy-setup/ pnpm --filter @elrs-easy/web build
          pnpm check:pages-build
          pnpm licenses:report
          pnpm licenses:check
          pnpm security:audit

      - name: Commit green write-path candidate
        run: |
          rm -f .github/workflows/m2-write-path-hardening.yml
          rm -f .github/workflows/m2-parity-normalize.yml
          rm -f .github/workflows/m2-parity-authoritative.yml
          rm -f .github/workflows/m2-parity-audited-final.yml
          rm -f .github/workflows/m2-parity-repair-v3.yml
          rm -f .github/workflows/m2-parity-repair-v2.yml
          rm -f .github/workflows/m2-parity-finalize.yml
          rm -f .github/workflows/m2-audit-format-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(parity): enforce prewrite identity and postwrite version'
          git fetch origin feat/m2-real-hardware-first-test
          git rebase origin/feat/m2-real-hardware-first-test
          git push origin HEAD:feat/m2-real-hardware-first-test
