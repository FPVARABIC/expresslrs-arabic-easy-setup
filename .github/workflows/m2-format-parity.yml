name: M2 normalize parity source formatting

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-format-parity.yml

permissions:
  contents: write

concurrency:
  group: m2-format-parity
  cancel-in-progress: true

jobs:
  format:
    name: Apply Prettier and safe ESLint fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Wait for dependency lock and check out latest branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Refresh after a short dependency-lock window
        run: |
          sleep 45
          git fetch origin feat/m2-real-hardware-first-test
          git reset --hard origin/feat/m2-real-hardware-first-test

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Apply mechanical fixes
        run: |
          pnpm format
          pnpm exec eslint . --fix || true
          pnpm format
          pnpm format:check

      - name: Commit normalized source
        run: |
          rm -f .github/workflows/m2-format-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style(parity): normalize complete hardware source'
            git fetch origin feat/m2-real-hardware-first-test
            git rebase origin/feat/m2-real-hardware-first-test
            git push origin HEAD:feat/m2-real-hardware-first-test
          fi
