name: M2 normalize official catalog and primary path

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-parity-normalize.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: m2-parity-normalize
  cancel-in-progress: true

jobs:
  normalize:
    name: Use flexible official parsers and enforce the real primary path
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out latest branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Cancel stale branch workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feat%2Fm2-real-hardware-first-test&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\") | .id" \
            | while read -r id; do
                [ -z "$id" ] || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
              done
          sleep 6
          git fetch origin feat/m2-real-hardware-first-test
          git reset --hard origin/feat/m2-real-hardware-first-test

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @elrs-easy/web add fflate@0.8.2 --save-exact

      - name: Normalize catalog parsing and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/hardware/official-catalog.ts')
          text = path.read_text(encoding='utf-8')
          if 'parseOfficialReleaseIndexFlexible' not in text:
              insertion = '''import { parseOfficialReleaseIndexFlexible } from "./official-index";
import { parseOfficialTargetsFlexible } from "./official-target-index";
'''
              marker = 'import type {\n'
              index = text.find(marker)
              if index < 0:
                  raise SystemExit('Official catalog import marker is missing')
              text = text[:index] + insertion + text[index:]
          text = text.replace(
              'const releases = parseOfficialReleaseIndex(parseJson(indexBytes));',
              'const releases = parseOfficialReleaseIndexFlexible(parseJson(indexBytes));',
          )
          text = text.replace(
              '''  const targets = parseOfficialTargets(
    parseJson(targetJsonFromHardwareArchive(hardwareBytes)),
  );''',
              '''  const targets = parseOfficialTargetsFlexible(
    parseJson(targetJsonFromHardwareArchive(hardwareBytes)),
  );''',
          )
          path.write_text(text, encoding='utf-8')

          # Preserve Unicode display names while keeping identifiers and paths bounded.
          path = Path('apps/web/src/hardware/official-target-index.ts')
          text = path.read_text(encoding='utf-8')
          old = '''function safeKey(value: unknown, maximum = 160): string | null {
  return typeof value === "string" &&
    value.length > 0 &&
    value.length <= maximum &&
    /^[A-Za-z0-9_.@+ /()-]+$/u.test(value)
    ? value
    : null;
}
'''
          new = '''function safeKey(value: unknown, maximum = 160): string | null {
  if (typeof value !== "string") return null;
  const normalized = value
    .normalize("NFC")
    .trim()
    .replace(/[\\u202a-\\u202e\\u2066-\\u2069]/gu, "");
  return normalized.length > 0 &&
    normalized.length <= maximum &&
    !/[\\u0000-\\u001f\\u007f-\\u009f]/u.test(normalized) &&
    !normalized.includes("..")
    ? normalized
    : null;
}
'''
          if old in text:
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          # Remaining TypeScript 6 body conversions in the generated package tests.
          path = Path('apps/web/src/hardware/firmware-package.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''      new Response(
        zipSync({
          "firmware/EU/OTHER/firmware.bin": espImage(),
        }),
      ),''',
              '''      new Response(
        zipSync({
          "firmware/EU/OTHER/firmware.bin": espImage(),
        }).slice().buffer,
      ),''',
          )
          path.write_text(text, encoding='utf-8')

          # Primary entrypoint may contain the real workbench only, never the legacy Mock App.
          main = Path('apps/web/src/main.tsx').read_text(encoding='utf-8')
          required = 'ExpressLrsParityWorkbench'
          forbidden = ['from "./App"', 'DeviceConnectionHub', '<App />']
          if required not in main or any(item in main for item in forbidden):
              raise SystemExit('The primary application entrypoint is not exclusively the real parity workbench')
          PY

      - name: Add permanent primary-path gate
        run: |
          cat > scripts/check-real-hardware-primary.mjs <<'EOF'
          import { readFile } from "node:fs/promises";

          const main = await readFile("apps/web/src/main.tsx", "utf8");
          const workbench = await readFile(
            "apps/web/src/components/ExpressLrsParityWorkbench.tsx",
            "utf8",
          );
          const failures = [];
          if (!main.includes("ExpressLrsParityWorkbench")) {
            failures.push("main.tsx does not render the real hardware workbench");
          }
          for (const forbidden of [
            'from "./App"',
            "DeviceConnectionHub",
            "runFoundationDemo",
            "mockScenarios",
          ]) {
            if (main.includes(forbidden)) {
              failures.push(`main.tsx contains forbidden legacy path: ${forbidden}`);
            }
          }
          for (const required of [
            "loadOfficialExpressLrsCatalog",
            "ExpressLrsHardwareSession.connect",
            "prepareOfficialFirmwarePackage",
            "flashEspFirmware",
            "flashXmodemFirmware",
            "validateRecoveryPackage",
            "reconnectAndVerify",
          ]) {
            if (!workbench.includes(required)) {
              failures.push(`real workbench is missing: ${required}`);
            }
          }
          if (failures.length > 0) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          console.log("Real hardware primary-path gate passed.");
          EOF
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.scripts["check:real-hardware-primary"] = "node scripts/check-real-hardware-primary.mjs";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

      - name: Format and run complete validation
        env:
          EXPRESSLRS_LIVE_CATALOG: "1"
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm check:boundaries
          pnpm check:security-headers
          pnpm check:pwa-safety
          pnpm check:visual-theme
          pnpm check:links
          pnpm check:master-plan
          pnpm check:real-hardware-primary
          pnpm test
          pnpm exec vitest run \
            apps/web/src/hardware/official-catalog.live.test.ts \
            apps/web/src/hardware/official-artifacts.live.test.ts
          pnpm build
          GITHUB_PAGES=true PAGES_BASE_PATH=/expresslrs-arabic-easy-setup/ pnpm --filter @elrs-easy/web build
          pnpm check:pages-build
          pnpm licenses:report
          pnpm licenses:check
          pnpm security:audit

      - name: Commit normalized green candidate
        run: |
          rm -f .github/workflows/m2-parity-normalize.yml
          rm -f .github/workflows/m2-parity-authoritative.yml
          rm -f .github/workflows/m2-parity-audited-final.yml
          rm -f .github/workflows/m2-parity-repair-v3.yml
          rm -f .github/workflows/m2-parity-repair-v2.yml
          rm -f .github/workflows/m2-parity-finalize.yml
          rm -f .github/workflows/m2-audit-format-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(parity): normalize official catalog and real primary path'
          git fetch origin feat/m2-real-hardware-first-test
          git rebase origin/feat/m2-real-hardware-first-test
          git push origin HEAD:feat/m2-real-hardware-first-test
