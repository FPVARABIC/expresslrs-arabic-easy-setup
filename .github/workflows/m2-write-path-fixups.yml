name: M2 write-path fixups and proof

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-write-path-fixups.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: m2-write-path-fixups
  cancel-in-progress: true

jobs:
  fix:
    name: Isolate layout/logo and bind recovery to its own release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out latest branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Cancel stale branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feat%2Fm2-real-hardware-first-test&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\") | .id" \
            | while read -r id; do
                [ -z "$id" ] || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
              done
          sleep 6
          git fetch origin feat/m2-real-hardware-first-test
          git reset --hard origin/feat/m2-real-hardware-first-test

      - name: Install toolchain
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @elrs-easy/web add fflate@0.8.2 --save-exact

      - name: Apply fixups
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/hardware/firmware-package.ts')
          text = path.read_text(encoding='utf-8')
          logo_start = text.find('function targetLogo(')
          logo_end = text.find('\nfunction platformFamily(', logo_start)
          if logo_start < 0 or logo_end < 0:
              raise SystemExit('targetLogo function boundary is missing')
          logo = text[logo_start:logo_end]
          logo = logo.replace(
              'archivePathMatches(name, target.config.layoutFile ?? wanted)',
              'archivePathMatches(name, target.config.logoFile ?? wanted)',
          )
          text = text[:logo_start] + logo + text[logo_end:]
          path.write_text(text, encoding='utf-8')

          path = Path('apps/web/src/components/ExpressLrsParityWorkbench.tsx')
          text = path.read_text(encoding='utf-8')
          recovery_start = text.find('  async function recoverFromFile(')
          recovery_end = text.find('\n  function updateOption<', recovery_start)
          if recovery_start < 0 or recovery_end < 0:
              raise SystemExit('Recovery function boundary is missing')
          recovery = text[recovery_start:recovery_end]
          recovery = recovery.replace(
              'await reconnectAndVerify(selectedTarget, prepared.release);',
              '''await reconnectAndVerify(selectedTarget, {
        label: validated.releaseLabel,
        revision: validated.releaseRevision,
        channel: /^v?\d+\.\d+\.\d+/u.test(validated.releaseLabel)
          ? "release"
          : "branch",
      });''',
          )
          text = text[:recovery_start] + recovery + text[recovery_end:]
          # A Target change invalidates every confirmation bound to the old package.
          text = text.replace(
              '''              setTargetId(nextId); setPrepared(null); setRecoveryDownloaded(false);''',
              '''              setTargetId(nextId);
              setPrepared(null);
              setRecoveryDownloaded(false);
              setPowerAcknowledged(false);
              setAntennaAcknowledged(false);
              setManualTargetConfirmation("");''',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and validate every gate
        env:
          EXPRESSLRS_LIVE_CATALOG: "1"
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm check:boundaries
          pnpm check:security-headers
          pnpm check:pwa-safety
          pnpm check:visual-theme
          pnpm check:links
          pnpm check:master-plan
          pnpm check:real-hardware-primary
          pnpm test
          pnpm exec vitest run \
            apps/web/src/hardware/official-catalog.live.test.ts \
            apps/web/src/hardware/official-artifacts.live.test.ts
          pnpm build
          GITHUB_PAGES=true PAGES_BASE_PATH=/expresslrs-arabic-easy-setup/ pnpm --filter @elrs-easy/web build
          pnpm check:pages-build
          pnpm licenses:report
          pnpm licenses:check
          pnpm security:audit

      - name: Commit green fixup candidate
        run: |
          rm -f .github/workflows/m2-write-path-fixups.yml
          rm -f .github/workflows/m2-write-path-hardening.yml
          rm -f .github/workflows/m2-parity-normalize.yml
          rm -f .github/workflows/m2-parity-authoritative.yml
          rm -f .github/workflows/m2-parity-audited-final.yml
          rm -f .github/workflows/m2-parity-repair-v3.yml
          rm -f .github/workflows/m2-parity-repair-v2.yml
          rm -f .github/workflows/m2-parity-finalize.yml
          rm -f .github/workflows/m2-audit-format-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(parity): bind recovery to its package and isolate logo layout'
          git fetch origin feat/m2-real-hardware-first-test
          git rebase origin/feat/m2-real-hardware-first-test
          git push origin HEAD:feat/m2-real-hardware-first-test
