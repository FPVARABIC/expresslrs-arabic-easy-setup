          if target_check in text and 'verifyObservedFirmwareBuild' not in text[text.find(target_check):text.find(target_check)+1500]:
              text = text.replace(
                  target_check,
                  target_check + '''
    const buildVerification = verifyObservedFirmwareBuild({
      release,
      observedVersion: outcome.identity.firmwareVersion,
      parameters: outcome.parameters,
    });
    if (!buildVerification.verified) {
      await outcome.session.close();
      throw new Error(
        `عاد Target الصحيح، لكن الإصدار/Commit لا يطابق ${buildVerification.expected}`,
      );
    }''',
                  1,
              )
          # Normal flash uses prepared release. Recovery uses recovery manifest release.
          flash_start = text.find('  async function flashPreparedFirmware()')
          flash_end = text.find('\n  async function recoverFromFile(', flash_start)
          if flash_start >= 0 and flash_end >= 0:
              block = text[flash_start:flash_end]
              block = block.replace(
                  'await reconnectAndVerify(selectedTarget);',
                  'await reconnectAndVerify(selectedTarget, prepared.release);',
              )
              text = text[:flash_start] + block + text[flash_end:]
          recovery_start = text.find('  async function recoverFromFile(')
          recovery_end = text.find('\n  function updateOption<', recovery_start)
          if recovery_start >= 0 and recovery_end >= 0:
              block = text[recovery_start:recovery_end]
              block = block.replace(
                  'await reconnectAndVerify(selectedTarget);',
                  '''await reconnectAndVerify(selectedTarget, {
        label: validated.releaseLabel,
        revision: validated.releaseRevision,
        channel: /^v?\d+\.\d+\.\d+/u.test(validated.releaseLabel)
          ? "release"
          : "branch",
      });''',
              )
              block = block.replace(
                  'await reconnectAndVerify(selectedTarget, prepared.release);',
                  '''await reconnectAndVerify(selectedTarget, {
        label: validated.releaseLabel,
        revision: validated.releaseRevision,
        channel: /^v?\d+\.\d+\.\d+/u.test(validated.releaseLabel)
          ? "release"
          : "branch",
      });''',
              )
              text = text[:recovery_start] + block + text[recovery_end:]

          # Lua download if absent.
          if 'async function downloadLuaScript' not in text:
              marker = '  function downloadRecovery() {\n'
              handler = '''  async function downloadLuaScript() {
    if (
      selectedRelease === null ||
      selectedTarget === null ||
      selectedTarget.role !== "tx" ||
      selectedTarget.config.luaName === null
    ) {
      return;
    }
    setBusy(true);
    setStatus("جارٍ تنزيل ملف Lua الرسمي المطابق لهذا Target…");
    try {
      const script = await acquireOfficialLuaScript({
        release: selectedRelease,
        target: selectedTarget,
      });
      downloadPreparedBytes(script.bytes, script.fileName, "text/plain");
      setStatus(`تم بدء تنزيل ملف Lua الرسمي: ${script.fileName}.`);
    } catch (error: unknown) {
      setStatus(`تعذر تنزيل ملف Lua: ${safeMessage(error)}`);
    } finally {
      setBusy(false);
    }
  }

'''
              if marker not in text:
                  raise SystemExit('Lua insertion marker missing')
              text = text.replace(marker, handler + marker, 1)

          # Region options use explicit official keys.
          text = text.replace(
              '{regionChoices.map((region) => <option key={region} value={region}>{region}</option>)}',
              '''<option value="">اختر المنطقة</option>
              {regionChoices.map((region) => (
                <option key={region.key} value={region.key}>
                  {region.label}
                </option>
              ))}''',
          )
          # Manual Target confirmation appears whenever auto-match is not exact.
          old_manual = '''            {method === "uart" ? null : method === "wifi" || method === "download" || method === "stlink" ? null : (
              <label className="manual-confirm">'''
          new_manual = '''            {!exactHardwareTarget &&
            method !== "wifi" &&
            method !== "download" &&
            method !== "stlink" ? (
              <label className="manual-confirm">'''
          text = text.replace(old_manual, new_manual)
          # Extend button gate for manual confirmation rather than exact-only direct UART.
          text = text.replace(
              '''(method === "uart" ? !exactHardwareTarget : !["wifi", "download", "stlink"].includes(method) && !manualTargetConfirmed)''',
              '''(!["wifi", "download", "stlink"].includes(method) &&
                  !exactHardwareTarget &&
                  !manualTargetConfirmed)''',
          )
          # Disable download actions during mutation.
          text = text.replace(
              '<button type="button" className="secondary-button" onClick={downloadFirmware}>',
              '<button type="button" className="secondary-button" disabled={busy} onClick={downloadFirmware}>',
          )
          text = text.replace(
              '<button type="button" className="secondary-button" onClick={downloadRecovery}>',
              '<button type="button" className="secondary-button" disabled={busy} onClick={downloadRecovery}>',
          )
          save(path, text)

          # Official regulatory names used by ExpressLRS 4.x.
          path = 'apps/web/src/hardware/regulatory-domain.ts'
          text = load(path)
          text = text.replace('key: "FCC_2400"', 'key: "ISM_2400"')
          text = text.replace('key: "US_433"', 'key: "FCC_433"')
          text = text.replace('label: "US 433 MHz"', 'label: "FCC 433 MHz"')
          text = text.replace('artifactDirectory: "US_433"', 'artifactDirectory: "FCC_433"')
          save(path, text)
          path = 'apps/web/src/hardware/regulatory-domain.test.ts'
          text = load(path).replace('"FCC_2400"', '"ISM_2400"').replace('"US_433"', '"FCC_433"')
          save(path, text)

          # CSP permits only official artifact hosts.
          for path in ['apps/web/public/_headers', 'apps/web/index.html']:
              text = load(path)
              if 'connect-src' in text and 'artifactory.expresslrs.org' not in text:
                  text = text.replace(
                      "connect-src 'self'",
                      "connect-src 'self' https://artifactory.expresslrs.org https://expresslrs.github.io",
                  )
              save(path, text)
          PY

      - name: Add permanent real-primary-path gate if missing
        run: |
          if [ ! -f scripts/check-real-hardware-primary.mjs ]; then
            cat > scripts/check-real-hardware-primary.mjs <<'EOF'
          import { readFile } from "node:fs/promises";
          const main = await readFile("apps/web/src/main.tsx", "utf8");
          const workbench = await readFile(
            "apps/web/src/components/ExpressLrsParityWorkbench.tsx",
            "utf8",
          );
          const failures = [];
          if (!main.includes("ExpressLrsParityWorkbench")) {
            failures.push("main.tsx does not render the real hardware workbench");
          }
          for (const forbidden of ['from "./App"', "DeviceConnectionHub", "mockScenarios"]) {
            if (main.includes(forbidden)) failures.push(`legacy primary path: ${forbidden}`);
          }
          for (const required of [
            "loadOfficialExpressLrsCatalog",
            "ExpressLrsHardwareSession.connect",
            "prepareOfficialFirmwarePackage",
            "flashEspFirmware",
            "flashXmodemFirmware",
            "validateRecoveryPackage",
            "reconnectAndVerify",
          ]) {
            if (!workbench.includes(required)) failures.push(`missing ${required}`);
          }
          if (failures.length) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          console.log("Real hardware primary-path gate passed.");
          EOF
          fi
          node - <<'NODE'
          const fs = require("fs");
          const path = "package.json";
          const json = JSON.parse(fs.readFileSync(path, "utf8"));
          json.scripts["check:real-hardware-primary"] =
            "node scripts/check-real-hardware-primary.mjs";
          fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
          NODE

      - name: Format, static analysis, tests, builds, and supply-chain gates
        env:
          EXPRESSLRS_LIVE_CATALOG: "1"
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm check:boundaries
          pnpm check:security-headers
          pnpm check:pwa-safety
          pnpm check:visual-theme
          pnpm check:links
          pnpm check:master-plan
          pnpm check:real-hardware-primary
          pnpm test
          pnpm exec vitest run \
            apps/web/src/hardware/official-catalog.live.test.ts \
            apps/web/src/hardware/official-artifacts.live.test.ts
          pnpm build
          GITHUB_PAGES=true PAGES_BASE_PATH=/expresslrs-arabic-easy-setup/ pnpm --filter @elrs-easy/web build
          pnpm check:pages-build
          pnpm licenses:report
          pnpm licenses:check
          pnpm security:audit

      - name: Commit the green convergence candidate
        run: |
          rm -f .github/workflows/m2-parity-green-v1.yml
          rm -f .github/workflows/m2-parity-final-report.yml
          rm -f .github/workflows/m2-write-path-fixups.yml
          rm -f .github/workflows/m2-write-path-hardening.yml
          rm -f .github/workflows/m2-parity-normalize.yml
          rm -f .github/workflows/m2-parity-authoritative.yml
          rm -f .github/workflows/m2-parity-audited-final.yml
          rm -f .github/workflows/m2-parity-repair-v3.yml
          rm -f .github/workflows/m2-parity-repair-v2.yml
          rm -f .github/workflows/m2-parity-finalize.yml
          rm -f .github/workflows/m2-audit-format-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(parity): converge official ExpressLRS TX/RX workflow'
          git fetch origin feat/m2-real-hardware-first-test
          git rebase origin/feat/m2-real-hardware-first-test
          git push origin HEAD:feat/m2-real-hardware-first-test
