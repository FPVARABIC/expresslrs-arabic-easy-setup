name: M2 converge official TX/RX parity candidate

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-parity-green-v1.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: m2-parity-green-v1
  cancel-in-progress: true

jobs:
  converge:
    name: Patch latest head, run every gate, and commit only green source
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out latest branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Cancel stale branch runs and refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feat%2Fm2-real-hardware-first-test&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\") | .id" \
            | while read -r id; do
                [ -z "$id" ] || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
              done
          sleep 6
          git fetch origin feat/m2-real-hardware-first-test
          git reset --hard origin/feat/m2-real-hardware-first-test

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @elrs-easy/web add fflate@0.8.2 --save-exact

      - name: Apply consolidated functional and safety patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def save(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Official source fallback: Pages mirror first, Artifactory second.
          # ------------------------------------------------------------------
          path = 'apps/web/src/hardware/official-catalog.ts'
          text = load(path)
          if './official-source' not in text:
              text = text.replace(
                  'import { unzipSync } from "fflate";\n',
                  'import { unzipSync } from "fflate";\n\nimport { fetchOfficialExpressLrsResource } from "./official-source";\n',
                  1,
              )
          if './official-index' not in text:
              marker = 'import type {\n'
              at = text.find(marker)
              if at < 0:
                  raise SystemExit('official-catalog import marker missing')
              text = (
                  text[:at]
                  + 'import { parseOfficialReleaseIndexFlexible } from "./official-index";\n'
                  + 'import { parseOfficialTargetsFlexible } from "./official-target-index";\n'
                  + text[at:]
              )
          text = re.sub(
              r'export const EXPRESSLRS_ARTIFACT_BASE\s*=\s*\n?\s*"[^"]+"\s+as const;\n\n',
              '',
              text,
              count=1,
          )
          function_start = text.find('async function fetchBytes(')
          function_end = text.find('\nfunction parseJson(', function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit('official-catalog fetchBytes boundaries missing')
          fetch_function = '''async function fetchBytes(input: {
  readonly path: string;
  readonly maximumBytes: number;
  readonly signal?: AbortSignal;
  readonly fetchImplementation?: typeof fetch;
  readonly onProgress?: (received: number, total: number | null) => void;
}): Promise<Uint8Array> {
  const bridge = abortBridge(input.signal, 45_000);
  try {
    const response = await fetchOfficialExpressLrsResource({
      path: input.path,
      signal: bridge.signal,
      ...(input.fetchImplementation === undefined
        ? {}
        : { fetchImplementation: input.fetchImplementation }),
      accept: "application/json, application/zip;q=0.9",
    });
    return await readBoundedResponse(
      response,
      input.maximumBytes,
      input.onProgress,
    );
  } catch (error: unknown) {
    if (error instanceof OfficialCatalogError) throw error;
    throw new OfficialCatalogError(
      "NETWORK",
      error instanceof Error ? error.message : "Official catalog request failed",
    );
  } finally {
    bridge.dispose();
  }
}
'''
          text = text[:function_start] + fetch_function + text[function_end:]
          text = text.replace(
              'url: `${EXPRESSLRS_ARTIFACT_BASE}/index.json`,',
              'path: "index.json",',
