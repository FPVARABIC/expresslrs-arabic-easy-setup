# Publishes only the exact reviewed candidate pinned below.\nname: Deploy reviewed Pages candidate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-reviewed-pages.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  REVIEWED_SHA: 9b9544e51107af6fca2847c59e18e3f1f6783672
  PAGES_BASE_PATH: /expresslrs-arabic-easy-setup/

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package reviewed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out exact reviewed candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"

      - name: Require committed dependency lockfile
        run: test -f pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run complete source quality gate
        run: |
          pnpm check
          pnpm licenses:report
          pnpm licenses:check
          pnpm security:audit

      - name: Build exact GitHub Pages artifact
        env:
          GITHUB_PAGES: "true"
        run: pnpm --filter @elrs-easy/web build

      - name: Verify GitHub Pages artifact
        run: pnpm check:pages-build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist
          retention-days: 14

  deploy:
    name: Publish reviewed preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify configured Pages path
        env:
          DISCOVERED_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: test "$DISCOVERED_BASE_PATH" = "$PAGES_BASE_PATH"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
