name: M2 final authoritative parity report

on:
  push:
    branches:
      - feat/m2-real-hardware-first-test
    paths:
      - .github/workflows/m2-parity-final-report.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: m2-final-authoritative-parity-report
  cancel-in-progress: true

jobs:
  report:
    name: Validate latest head and preserve exact evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out latest branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/m2-real-hardware-first-test
          fetch-depth: 0

      - name: Cancel stale runs and refresh branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feat%2Fm2-real-hardware-first-test&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\") | .id" \
            | while read -r id; do
                [ -z "$id" ] || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
              done
          sleep 8
          git fetch origin feat/m2-real-hardware-first-test
          git reset --hard origin/feat/m2-real-hardware-first-test

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependency graph
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm install --no-frozen-lockfile
            pnpm --filter @elrs-easy/web add fflate@0.8.2 --save-exact
          } 2>&1 | tee /tmp/install.log

      - name: Verify implementation wiring before tools run
        id: wiring
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/wiring.log
          from pathlib import Path

          requirements = {
              'apps/web/src/main.tsx': [
                  'ExpressLrsParityWorkbench',
              ],
              'apps/web/src/components/ExpressLrsParityWorkbench.tsx': [
                  'loadOfficialExpressLrsCatalog',
                  'ExpressLrsHardwareSession.connect',
                  'prepareOfficialFirmwarePackage',
                  'verifyCurrentIdentity',
                  'verifyObservedFirmwareVersion',
                  'flashEspFirmware',
                  'flashXmodemFirmware',
                  'validateRecoveryPackage',
                  'downloadLuaScript',
                  'reconnectAndVerify',
                  'ثبات الطاقة أثناء التفليش',
              ],
              'apps/web/src/hardware/firmware-package.ts': [
                  'validateFirmwareOptions',
                  'sha256Hex',
                  'recoveryArchive',
                  'actualUncompressedBytes',
              ],
              'apps/web/src/hardware/session.ts': [
                  'verifyCurrentIdentity',
                  'writeParameter',
                  'restoreSettingsBackup',
                  'startBinding',
              ],
              'apps/web/src/hardware/official-source.ts': [
                  'expresslrs.github.io',
                  'artifactory.expresslrs.org',
                  'UNTRUSTED_REDIRECT',
              ],
          }
          failures = []
          for relative, tokens in requirements.items():
              path = Path(relative)
              if not path.exists():
                  failures.append(f'Missing file: {relative}')
                  continue
              text = path.read_text(encoding='utf-8')
              for token in tokens:
                  if token not in text:
                      failures.append(f'{relative} missing {token}')
          main = Path('apps/web/src/main.tsx').read_text(encoding='utf-8')
          for forbidden in ['from "./App"', 'DeviceConnectionHub', '<App />']:
              if forbidden in main:
                  failures.append(f'Legacy primary path is still active: {forbidden}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Implementation wiring gate passed.')
          PY

      - name: Format candidate
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm format
            pnpm format:check
          } 2>&1 | tee /tmp/format.log

      - name: Lint candidate
        id: lint
        continue-on-error: true
        run: pnpm lint 2>&1 | tee /tmp/lint.log

      - name: Typecheck candidate
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Run repository policy gates
        id: policies
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm check:boundaries
            pnpm check:security-headers
            pnpm check:pwa-safety
            pnpm check:visual-theme
            pnpm check:links
            pnpm check:master-plan
            pnpm check:real-hardware-primary
          } 2>&1 | tee /tmp/policies.log

      - name: Run complete automated tests
        id: tests
        continue-on-error: true
        run: pnpm test 2>&1 | tee /tmp/tests.log

      - name: Run live official-source contract tests
        id: live
        continue-on-error: true
        env:
          EXPRESSLRS_LIVE_CATALOG: "1"
        run: |
          set -o pipefail
          pnpm exec vitest run \
            apps/web/src/hardware/official-catalog.live.test.ts \
            apps/web/src/hardware/official-artifacts.live.test.ts \
            2>&1 | tee /tmp/live.log

      - name: Build production application
        id: build
        continue-on-error: true
        run: pnpm build 2>&1 | tee /tmp/build.log

      - name: Build and verify Pages artifact
        id: pages
        continue-on-error: true
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /expresslrs-arabic-easy-setup/
        run: |
          set -o pipefail
          {
            pnpm --filter @elrs-easy/web build
            pnpm check:pages-build
          } 2>&1 | tee /tmp/pages.log

      - name: Verify licenses and known advisories
        id: supply
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm licenses:report
            pnpm licenses:check
            pnpm security:audit
          } 2>&1 | tee /tmp/supply.log

      - name: Write exact final report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          WIRING: ${{ steps.wiring.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          POLICIES: ${{ steps.policies.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LIVE: ${{ steps.live.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          SUPPLY: ${{ steps.supply.outcome }}
        run: |
          mkdir -p docs/testing
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          gates = [
              ('Install', os.environ['INSTALL'], '/tmp/install.log'),
              ('Implementation wiring', os.environ['WIRING'], '/tmp/wiring.log'),
              ('Format', os.environ['FORMAT'], '/tmp/format.log'),
              ('Lint', os.environ['LINT'], '/tmp/lint.log'),
              ('TypeScript', os.environ['TYPECHECK'], '/tmp/typecheck.log'),
              ('Policy gates', os.environ['POLICIES'], '/tmp/policies.log'),
              ('Automated tests', os.environ['TESTS'], '/tmp/tests.log'),
              ('Live official sources', os.environ['LIVE'], '/tmp/live.log'),
              ('Production build', os.environ['BUILD'], '/tmp/build.log'),
              ('Pages build', os.environ['PAGES'], '/tmp/pages.log'),
              ('Licenses and advisories', os.environ['SUPPLY'], '/tmp/supply.log'),
          ]
          success = all(outcome == 'success' for _, outcome, _ in gates)
          tests_text = Path('/tmp/tests.log').read_text(encoding='utf-8', errors='replace') if Path('/tmp/tests.log').exists() else ''
          test_files = re.findall(r'Test Files\s+(\d+) passed', tests_text)
          test_count = re.findall(r'Tests\s+(\d+) passed', tests_text)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          lines = [
              '# Final authoritative ExpressLRS TX/RX parity report',
              '',
              f'- Input SHA: `{head}`',
              f'- Software result: `{"PASS" if success else "FAIL"}`',
              f'- Test files passed: `{test_files[-1] if test_files else "UNKNOWN"}`',
              f'- Tests passed: `{test_count[-1] if test_count else "UNKNOWN"}`',
              '- Hardware validation: `NONE`',
              '- Stable Pages real writes enabled: `NO`',
              '',
              '| Gate | Outcome |',
              '|---|---|',
          ]
          for name, outcome, _ in gates:
              lines.append(f'| {name} | `{outcome.upper()}` |')
          lines.extend([
              '',
              '## Official ExpressLRS comparison',
              '',
              '| Capability | This checkpoint |',
              '|---|---|',
              '| Releases / branches | Implemented from official index |',
              '| Vendors / bands / Targets | Implemented from official targets archive |',
              '| Binding phrase UID | Implemented |',
              '| Regulatory domains | Implemented with explicit user selection |',
              '| TX and RX build options | Implemented and validated before acquisition |',
              '| Target Firmware generation | Implemented with bounded extraction and SHA-256 |',
              '| Firmware / recovery downloads | Implemented |',
              '| Target-specific Lua | Implemented |',
              '| Direct UART / Espressif | Implemented in software |',
              '| EdgeTX passthrough | Implemented in software |',
              '| Flight-controller passthrough | Implemented in software |',
              '| STM32 XMODEM | Implemented in software |',
              '| Wi-Fi path | Official-style download and local-device handoff |',
              '| CRSF settings and backup/restore | Implemented; additional to Web Flasher |',
              '| Bind command | Implemented; RF link still requires physical observation |',
              '| Recovery checkpoint | Implemented; additional fail-closed gate |',
              '| Reconnect verification | Requires exact Target and expected version |',
              '| Internal ST-Link/WebUSB | Not yet claimed |',
              '| Backpack / VRX | Outside current TX/RX scope |',
              '',
              '## Evidence boundary',
              '',
              'A software PASS proves formatting, static analysis, protocol/unit tests, live official-source contracts, production builds, Pages artifact checks, licenses, and dependency advisory gates. It does not prove a physical write on a commercial Target.',
          ])
          if not success:
              lines.extend(['', '## Failure tails', ''])
              for name, outcome, log_name in gates:
                  if outcome == 'success':
                      continue
                  path = Path(log_name)
                  tail = path.read_text(encoding='utf-8', errors='replace').splitlines()[-120:] if path.exists() else ['No log produced.']
                  lines.extend([f'### {name}', '', '```text', *tail, '```', ''])
          report = Path('docs/testing/expresslrs-feature-parity-validation.md')
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('/tmp/final-parity-result').write_text('1' if success else '0', encoding='utf-8')
          if success:
              Path('docs/testing/EXPRESSLRS_TX_RX_SOFTWARE_PARITY_READY').write_text(
                  head + '\n', encoding='utf-8'
              )
          else:
              Path('docs/testing/EXPRESSLRS_TX_RX_SOFTWARE_PARITY_READY').unlink(missing_ok=True)
          PY

      - name: Commit source and final evidence
        if: always()
        run: |
          result="$(cat /tmp/final-parity-result)"
          if [ "$result" = "1" ]; then
            rm -f .github/workflows/m2-parity-final-report.yml
            rm -f .github/workflows/m2-write-path-fixups.yml
            rm -f .github/workflows/m2-write-path-hardening.yml
            rm -f .github/workflows/m2-parity-normalize.yml
            rm -f .github/workflows/m2-parity-authoritative.yml
            rm -f .github/workflows/m2-parity-audited-final.yml
            rm -f .github/workflows/m2-parity-repair-v3.yml
            rm -f .github/workflows/m2-parity-repair-v2.yml
            rm -f .github/workflows/m2-parity-finalize.yml
            rm -f .github/workflows/m2-audit-format-export.yml
            message='test(parity): record green authoritative ExpressLRS report'
          else
            message='test(parity): preserve authoritative failure report'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git fetch origin feat/m2-real-hardware-first-test
            git rebase origin/feat/m2-real-hardware-first-test
            git push origin HEAD:feat/m2-real-hardware-first-test
          fi

      - name: Enforce report outcome
        if: always()
        run: |
          if [ "$(cat /tmp/final-parity-result)" != "1" ]; then
            echo '::error::The final parity report contains failed gates. Exact tails were committed to docs/testing/expresslrs-feature-parity-validation.md.'
            exit 1
          fi
