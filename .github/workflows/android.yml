name: Android host

# Builds the Android host APK, runs Gradle lint and the JVM unit tests, and
# publishes the APK with its SHA-256.
#
# The Android SDK cannot be downloaded in the development sandbox this project
# is worked on from, so this is where an APK is produced at all. What it proves
# is bounded and stated in docs/ANDROID.md: the project compiles, lint is
# clean, and the rules in UsbDeviceGate hold. It proves nothing about USB OTG,
# because no emulator has a USB host.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Gradle lint
        working-directory: android
        run: gradle --no-daemon lintDebug

      - name: JVM unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble the debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Record the APK identity
        working-directory: android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          echo "APK:    $apk"
          echo "bytes:  $(stat -c%s "$apk")"
          echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)"
          sha256sum "$apk" > app-debug.apk.sha256

      - name: Publish the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elrs-android-host-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the lint and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports-${{ github.run_attempt }}
          path: |
            android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
